<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #fff;
            color: #333;
        }

        .main-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px;
            background: #fff;
        }

        .page-header {
            padding: 14px 16px;
            margin-bottom: 14px;
            border-radius: 10px;
            background: #f7f9fc;
            border: 1px solid #e8edf5;
            line-height: 1.7;
            color: #4a5568;
            font-size: 14px;
        }

        .page-title {
            font-size: 17px;
            font-weight: 800;
            color: #222;
            margin-bottom: 6px;
        }

        .accordion-item {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .accordion-item[open] {
            border-color: #cfd8e6;
            box-shadow: 0 4px 12px rgba(15, 23, 42, .06);
        }

        .accordion-summary {
            list-style: none;
            cursor: pointer;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 600;
            color: #2d3748;
            background: #fbfcfe;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .accordion-summary::-webkit-details-marker {
            display: none;
        }

        .summary-arrow {
            font-size: 12px;
            color: #718096;
            transition: transform .2s ease;
        }

        .accordion-item[open] .summary-arrow {
            transform: rotate(90deg);
        }

        .summary-text {
            flex: 1;
            word-break: break-word;
        }

        .accordion-body {
            padding: 16px;
        }

        .base-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            line-height: 1.7;
        }

        .base-label {
            width: 110px;
            flex: 0 0 110px;
            color: #4b5563;
            font-size: 14px;
            font-weight: 700;
        }

        .base-value {
            flex: 1;
            color: #374151;
            font-size: 14px;
            word-break: break-word;
        }

        .pre-value {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.7;
            color: #374151;
        }

        .field-block {
            margin-bottom: 14px;
        }

        .field-label {
            display: block;
            margin-bottom: 6px;
            color: #4b5563;
            font-size: 14px;
            font-weight: 600;
        }

        .field-input,
        .field-textarea,
        .field-select {
            width: 100%;
            border: 1px solid #d6dbe5;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            color: #374151;
            background: #fff;
            outline: none;
        }

        .field-input:focus,
        .field-textarea:focus,
        .field-select:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, .12);
        }

        .field-textarea {
            min-height: 88px;
            line-height: 1.7;
            resize: vertical;
        }

        .field-select {
            height: 40px;
        }

        .action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .detail-link {
            color: #3178f6;
            text-decoration: underline;
            font-size: 14px;
            word-break: break-all;
        }

        .save-btn {
            min-width: 88px;
            height: 36px;
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            background: #4a90e2;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-btn[disabled] {
            opacity: .65;
            cursor: not-allowed;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            padding: 10px 16px;
            background: rgba(31, 41, 55, .92);
            color: #fff;
            border-radius: 20px;
            font-size: 13px;
            display: none;
            z-index: 9999;
        }

        @media (max-width:520px) {
            .main-container {
                padding: 12px;
            }

            .accordion-summary {
                padding: 12px 14px;
                font-size: 14px;
            }

            .accordion-body {
                padding: 14px;
            }

            .base-row {
                display: block;
            }

            .base-label {
                width: auto;
                flex: none;
                margin-bottom: 4px;
            }

            .action-row {
                align-items: flex-start;
            }

            .save-btn {
                width: 100%;
            }
        }
    </style>

</head>

<body>
    <div class="main-container">
        <div class="page-header">
            <div class="page-title">周期进展填报提醒</div>
            <div>您当前有1个项目进展待查看和确认，已由 AI 为您生成进展草稿，请您查看和确认！</div>
        </div>
        <details class="accordion-item" open>
            <summary class="accordion-summary"><span class="summary-arrow">&gt;</span><span
                    class="summary-text">海外标书智能解析智能工具项目组合1进展待确认</span></summary>
            <div class="accordion-body js-project-panel" data-progress-id="1301833188898246656"
                data-portfolio-id="1282191554358194176">
                <div class="base-row">
                    <div class="base-label">项目名称：</div>
                    <div class="base-value">海外标书智能解析智能工具项目组合1</div>
                </div>
                <div class="base-row">
                    <div class="base-label">项目层级：</div>
                    <div class="base-value">事业部级项目群</div>
                </div>
                <div class="field-block"><label class="field-label">标题</label><textarea class="field-textarea js-title"
                        rows="2">海外标书智能解析智能工具项目组合1The 35th week 双周报 2026-9-2</textarea></div>
                <div class="field-block"><label class="field-label">本期进展</label><textarea
                        class="field-textarea js-current-progress"
                        rows="6">1. 项目组合系统推宣任务（IT202607090001）按计划推进中，计划于2026年07月31日前完成，当前处于执行阶段。</textarea></div>
                <div class="field-block"><label class="field-label">下期计划</label><textarea
                        class="field-textarea js-next-plan" rows="4"></textarea></div>
                <div class="field-block"><label class="field-label">问题及风险</label><textarea
                        class="field-textarea js-issues-risks" rows="4"></textarea></div>
                <div class="field-block"><label class="field-label">项目亮灯</label><select
                        class="field-select js-warning-light">
                        <option value="GREEN" selected>绿灯：进展正常</option>
                        <option value="YELLOW">黄灯：延误/告警</option>
                        <option value="RED">红灯：有重大丢单风险</option>
                        <option value="BLACK">黑灯：失败</option>
                    </select></div>
                <div class="field-block"><label class="field-label">资源及求助</label><textarea
                        class="field-textarea js-resource-request" rows="4"></textarea></div>
                <div class="action-row"><a class="detail-link"
                        href="https://ssc.test.zte.com.cn/zte-bmt-pcs-portal/projectPortfolioList/portfolioPage"
                        target="_blank" rel="noopener noreferrer">查看项目进展详情</a><button type="button"
                        class="save-btn js-save-progress">确定</button></div>
            </div>
        </details>
        <div style="margin-top:12px;"><button class="save-btn" type="button" onclick="getToken();">测试按钮</button></div>
    </div>
    <div id="toast" class="toast"></div>
</body>

</html>
